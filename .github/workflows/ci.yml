name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BinPm.sln

      - name: Build
        run: dotnet build BinPm.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/BinPm.Core.Tests/BinPm.Core.Tests.csproj -c Release --no-build

  ebuild:
    name: gentoo ebuild sanity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Ebuild must parse
        run: bash -n gentoo/app-misc/binpm/binpm-0.1.0.ebuild

      - name: Wrapper must parse
        run: sh -n gentoo/app-misc/binpm/files/binpm.wrapper

  smoke:
    name: cli smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish the CLI
        run: >
          dotnet publish src/BinPm.Cli/BinPm.Cli.csproj
          -c Release -o out --self-contained false

      - name: The CLI runs
        run: |
          ./out/binpm --version
          ./out/binpm --help
          ./out/binpm doctor
